[modulo]
id = "40"
nome = "papel"
titulo = "Papel de parede e area de trabalho"
afetada_por = ["papel", "cor_papel", "icones_area"]

# Mudou a resolucao da tela? Rode de novo so esta etapa: aplicar --apenas papel

# o papel e desenhado aqui (papel.py, em SVG) e passado para PNG no tamanho
# do maior monitor pelo rsvg-convert; nada e baixado
[[passo]]
tipo = "script"
se = "papel != manter"
dizer = "desenhando o papel de parede: @@cor_papel@@, @@papel@@"
corpo = '''
rsvg=$(command -v rsvg-convert || true)
[ -n "$rsvg" ] || { echo "atencao: sem o rsvg-convert (librsvg2-bin); o papel de parede fica como esta"; exit 0; }
read -r largura altura <<< "$(python3 "$CTX_ARQUIVOS/tela.py" maior)"
mkdir -p "$CTX_PAPEIS_DIR"
d3_antes "$CTX_PAPEL_ARQUIVO"
tmp=$(mktemp -d "$CTX_PAPEIS_DIR/.desenho.XXXXXX")
trap 'rm -rf "$tmp"' EXIT
python3 "$CTX_ARQUIVOS/papel.py" --estilo "$CTX_PAPEL" --cor "$CTX_COR_PAPEL" \
  --largura "$largura" --altura "$altura" > "$tmp/papel.svg"
"$rsvg" -w "$largura" -h "$altura" -o "$tmp/papel.png" "$tmp/papel.svg"
mv -f "$tmp/papel.png" "$CTX_PAPEL_ARQUIVO"
echo "papel de parede de ${largura}x${altura} em $CTX_PAPEL_ARQUIVO"
'''

[[passo]]
tipo = "script"
se = "papel != manter"
dizer = "aplicando o papel em todos os monitores"
tolera_falha = true
corpo = '''
for p in $(xfconf-query -c xfce4-desktop -l 2>/dev/null | grep -E 'last-image$'); do
  d3_xfconf xfce4-desktop "$p" string
  xfconf-query -c xfce4-desktop -p "$p" -s "$CTX_PAPEL_ARQUIVO"
done
# a chave do monitor ligado agora pode ainda nao existir
for mon in $(xrandr --query 2>/dev/null | awk '/ connected/{print $1}'); do
  chave="/backdrop/screen0/monitor$mon/workspace0/last-image"
  d3_xfconf xfce4-desktop "$chave" string
  d3_xfconf xfce4-desktop "/backdrop/screen0/monitor$mon/workspace0/image-style" int
  xfconf-query -c xfce4-desktop -p "$chave" -n -t string -s "$CTX_PAPEL_ARQUIVO" 2>/dev/null \
    || xfconf-query -c xfce4-desktop -p "$chave" -s "$CTX_PAPEL_ARQUIVO" 2>/dev/null || true
  xfconf-query -c xfce4-desktop -p "/backdrop/screen0/monitor$mon/workspace0/image-style" \
    -n -t int -s 5 2>/dev/null || true
done
xfdesktop --reload >/dev/null 2>&1 || true
'''

[[passo]]
