[modulo]
id = "20"
nome = "aparencia"
titulo = "Tema, icones, cursor, fontes e cor de destaque"
requer = ["10"]
afetada_por = ["modo", "destaque", "fonte", "fonte_tamanho", "cursor", "botoes_janela"]

[[passo]]
tipo = "xfconf"
dizer = "aplicando o tema @@gtk_tema@@"
canal = "xsettings"
chave = "/Net/ThemeName"
valor = "@@gtk_tema@@"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Net/IconThemeName"
valor = "@@icones_tema@@"

[[passo]]
tipo = "xfconf"
dizer = "cursor @@cursor_tema@@"
canal = "xsettings"
chave = "/Gtk/CursorThemeName"
valor = "@@cursor_tema@@"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Gtk/CursorThemeSize"
tipo_valor = "int"
valor = "@@cursor_tamanho@@"

[[passo]]
tipo = "xfconf"
se = "fonte != sistema"
canal = "xsettings"
chave = "/Gtk/FontName"
valor = "@@fonte_ui@@ @@fonte_tamanho@@"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Gtk/MonospaceFontName"
valor = "@@fonte_mono@@ 10"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Xft/HintStyle"
valor = "hintslight"

[[passo]]
tipo = "xfconf"
canal = "xsettings"
chave = "/Xft/RGBA"
valor = "rgb"

# janela macia: titulo no centro e so os tres botoes, a direita ou a esquerda
# (botoes_janela; a esquerda e o CHM| do DESERT OS)
[[passo]]
tipo = "xfconf"
dizer = "ajustando as janelas"
canal = "xfwm4"
chave = "/general/theme"
valor = "@@gtk_tema@@"

# com o encaixe ligado o 35 troca o tema acima pela copia de bordas largas;
# se so esta receita rodar de novo, a copia e refeita aqui
[[passo]]
tipo = "script"
se = "janelas == sim"
tolera_falha = true
corpo = '''
b="$HOME/.local/bin/d3bian-bordas"
[ -x "$b" ] || exit 0
d3_antes "$HOME/.themes/$CTX_GTK_TEMA-bordas"
novo=$("$b" "$CTX_GTK_TEMA" 4)
d3_xfconf xfwm4 /general/theme string
xfconf-query -c xfwm4 -p /general/theme -s "$novo"
'''

[[passo]]
tipo = "xfconf"
canal = "xfwm4"
chave = "/general/button_layout"
valor = "@@botoes_xfwm@@"

# os apps GTK que desenham a propria barra (CSD) seguem o /Gtk/DecorationLayout.
# A esquerda grava close,minimize,maximize: (o do DESERT OS); a direita devolve
# o valor de antes do projeto, que o diario guardou, ou tira a propriedade se
# ela nao existia. Sem nada no diario, o projeto nunca mexeu nela
[[passo]]
tipo = "script"
tolera_falha = true
corpo = '''
p=/Gtk/DecorationLayout
if [ -n "$CTX_BOTOES_GTK" ]; then
  d3_xfconf xsettings "$p" string
  xfconf-query -c xsettings -p "$p" -n -t string -s "$CTX_BOTOES_GTK" 2>/dev/null \
    || xfconf-query -c xsettings -p "$p" -s "$CTX_BOTOES_GTK"
  echo "botoes a esquerda tambem nos apps GTK"
  exit 0
fi
# so devolve o que o proprio projeto pos; um ajuste feito depois pela pessoa fica
[ "$(xfconf-query -c xsettings -p "$p" 2>/dev/null || true)" = "$CTX_BOTOES_GTK_ESQUERDA" ] || exit 0
antes=$(PYTHONPATH="$D3_DIARIO_PAI" "$D3_DIARIO_PYTHON" - <<'PY'
import importlib, os
d = importlib.import_module(os.environ["D3_DIARIO_PACOTE"] + ".diario")
for i in d.ler():
    if i.get("tipo") == "xfconf" and i.get("canal") == "xsettings" and i.get("chave") == "/Gtk/DecorationLayout":
        # o primeiro e o de antes do projeto
        print("existia " + (i.get("valor") or "").strip() if i.get("existia") else "nao")
        break
PY
)
case "$antes" in
  "existia "*)
    xfconf-query -c xsettings -p "$p" -s "${antes#existia }" 2>/dev/null || true
    echo "botoes dos apps GTK como eram antes" ;;
  nao)
    xfconf-query -c xsettings -p "$p" -r 2>/dev/null || true
    echo "botoes dos apps GTK no padrao do Xfce" ;;
esac
'''

[[passo]]
tipo = "xfconf"
canal = "xfwm4"
chave = "/general/title_alignment"
valor = "center"

[[passo]]
tipo = "xfconf"
se = "fonte != sistema"
canal = "xfwm4"
chave = "/general/title_font"
valor = "@@fonte_titulo@@"

# apps GTK4 e libadwaita nao leem o xsettings. Sem o gsettings (a receita 10
# instala, mas pode ter sido tirado) so eles ficam sem o tema: nao e motivo para
# a etapa falhar. O valor de antes de cada chave e anotado para o desfazer
[[passo]]
tipo = "script"
dizer = "avisando os apps GTK4 que o modo e @@modo@@"
tolera_falha = true
corpo = '''
command -v gsettings >/dev/null || { echo "sem o gsettings (libglib2.0-bin): os apps GTK4 ficam com o tema deles"; exit 0; }
e=org.gnome.desktop.interface
poe() {
  d3_gsettings "$e" "$1"
  gsettings set "$e" "$1" "$2" 2>/dev/null || true
}
poe color-scheme "$CTX_GTK_ESQUEMA"
poe gtk-theme "$CTX_GTK_TEMA"
poe icon-theme "$CTX_ICONES_TEMA"
poe cursor-theme "$CTX_CURSOR_TEMA"
poe monospace-font-name "$CTX_FONTE_MONO 10"
# a cor de destaque dos apps libadwaita (GNOME 47 em diante) tem uma lista
# fechada de cores; vai a mais proxima. Sem a chave (esquema antigo), passa
if gsettings range "$e" accent-color >/dev/null 2>&1; then
  poe accent-color "$CTX_DESTAQUE_ADWAITA"
fi
'''

[[passo]]
tipo = "arquivo"
dizer = "arquivos de tema para quem nao le o xsettings"
destino = "~/.config/gtk-3.0/settings.ini"
conteudo = '''
[Settings]
gtk-theme-name=@@gtk_tema@@
gtk-icon-theme-name=@@icones_tema@@
gtk-cursor-theme-name=@@cursor_tema@@
gtk-cursor-theme-size=@@cursor_tamanho@@
gtk-font-name=@@fonte_ui@@ @@fonte_tamanho@@
gtk-application-prefer-dark-theme=@@gtk_escuro@@
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
'''

# GTK 2: um bloco marcado no ~/.gtkrc-2.0, que o desfazer tira (e apaga o
# arquivo se ele so existia pelo projeto). A versao anterior escrevia o arquivo
# inteiro com as mesmas quatro linhas, sem marca; esse arquivo sai antes, e o
# diario dele (copia de antes, ou criado) continua valendo no desfazer
[[passo]]
tipo = "script"
corpo = '''
f="$HOME/.gtkrc-2.0"
[ -f "$f" ] && [ ! -L "$f" ] || exit 0
grep -qxF "# $CTX_NOME" "$f" && exit 0
linhas=$(grep -c . "$f" || true)
nossas=$(grep -cxE 'gtk-(theme|icon-theme|cursor-theme|font)-name="[^"]*"' "$f" || true)
if [ "$linhas" = 4 ] && [ "$nossas" = 4 ]; then
  rm -f "$f"
  echo "~/.gtkrc-2.0 da versao anterior trocado por um bloco marcado"
fi
'''

[[passo]]
tipo = "bloco"
destino = "~/.gtkrc-2.0"
comentario = "#"
marca = "@@NOME@@"
conteudo = '''
gtk-theme-name="@@gtk_tema@@"
gtk-icon-theme-name="@@icones_tema@@"
gtk-cursor-theme-name="@@cursor_tema@@"
gtk-font-name="@@fonte_ui@@ @@fonte_tamanho@@"
'''

# o cursor da area de trabalho e dos programas que nao sao GTK
[[passo]]
tipo = "arquivo"
destino = "~/.icons/default/index.theme"
conteudo = '''
[Icon Theme]
Name=Default
Comment=Cursor escolhido pelo @@NOME@@
Inherits=@@cursor_tema@@
'''

# O Orchis do Debian so vem em azul. Por cima dele, a cor escolhida pinta a
# selecao, o botao principal, as chaves e as barras de progresso do GTK 3
[[passo]]
tipo = "bloco"
se = "destaque != orchis"
dizer = "cor de destaque: @@destaque@@"
destino = "~/.config/gtk-3.0/gtk.css"
marca = "@@NOME@@ destaque"
conteudo = '''
@define-color theme_selected_bg_color @@destaque_cor@@;
@define-color selected_bg_color @@destaque_cor@@;
@define-color accent_bg_color @@destaque_cor@@;
@define-color accent_color @@destaque_cor@@;
selection, .view:selected, treeview.view:selected, iconview:selected, row:selected,
flowboxchild:selected, entry selection, textview text selection, label selection {
  background-color: @@destaque_cor@@;
  color: @@destaque_texto@@;
}
button.suggested-action {
  background-color: @@destaque_cor@@;
  color: @@destaque_texto@@;
}
switch:checked {
  background-color: @@destaque_cor@@;
}
progressbar progress, scale highlight, levelbar block.filled {
  background-color: @@destaque_cor@@;
  border-color: @@destaque_cor@@;
}
'''

[[passo]]
tipo = "bloco"
se = "destaque == orchis"
destino = "~/.config/gtk-3.0/gtk.css"
marca = "@@NOME@@ destaque"
conteudo = '''
/* o azul do proprio Orchis: nada a trocar */
'''
