# picom do @@NOME@@ (picom 12.5 do Debian 13).
#
# Escrito pela receita 50 com a opcao "efeitos" e o que a maquina aguenta:
# mudar aqui some no proximo Aplicar. Enquanto o picom roda, o compositor do
# proprio xfwm4 fica desligado (xfwm4 /general/use_compositing).
# Situacao: @@picom_aviso@@

backend = "@@picom_backend@@";
vsync = @@picom_vsync@@;
use-damage = true;
log-level = "warn";

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = false;

# cantos: o mesmo raio das ilhas e da grade, para o desfoque nao vazar; no
# estilo desert, raio 25 e as ilhas redondas de ponta a ponta (desert.conf)
corner-radius = @@picom_raio@@;
@@picom_regras_raio@@
rounded-corners-exclude = [
  # janelas com moldura do xfwm4: o picom pintaria a moldura toda com a cor
  # do contorno (faixa escura em volta); os cantos de cima vem do tema
  "(window_type = 'normal' || window_type = 'dialog') && !_GTK_FRAME_EXTENTS@",
@@picom_excluir_barra@@
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "_GTK_FRAME_EXTENTS@"
];

# sombras
shadow = true;
shadow-radius = @@picom_sombra_raio@@;
shadow-opacity = @@picom_sombra_opacidade@@;
shadow-offset-x = @@picom_sombra_x@@;
shadow-offset-y = @@picom_sombra_y@@;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dnd'",
  "_GTK_FRAME_EXTENTS@"
];

# desfoque atras do que e translucido (ilhas, grade, terminal)
@@picom_desfoque@@

# transparencia de janelas
frame-opacity = 1.0;
inactive-opacity = 1.0;
inactive-opacity-override = false;
@@picom_opacidade@@

# abrir e fechar com um esmaecer curto
fading = true;
fade-in-step = @@picom_esmaecer_passo@@;
fade-out-step = @@picom_esmaecer_passo@@;
fade-delta = @@picom_esmaecer_delta@@;
no-fading-openclose = false;
@@picom_animacoes@@

wintypes: {
  tooltip = { fade = true; shadow = false; full-shadow = false; };
  dock = { shadow = true; clip-shadow-above = true; };
  dnd = { shadow = false; };
};
